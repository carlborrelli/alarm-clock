name: Test

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Create .env file
      run: |
        echo "HA_URL=http://localhost:8123" > .env
        echo "HA_TOKEN=test_token" >> .env
        echo "MOCK_WAKE_MODE=manual" >> .env

    - name: Build Docker images
      run: docker-compose build

    - name: Start services
      run: docker-compose up -d

    - name: Wait for services to be ready
      run: sleep 10

    - name: Check services are running
      run: docker-compose ps

    - name: Test kiosk backend is responding
      run: |
        curl -f http://localhost:3000/api/status || exit 1

    - name: Check alarm service logs
      run: docker-compose logs alarm-fallback

    - name: Stop services
      run: docker-compose down

  lint-python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install flake8
        pip install -r setup/requirements.txt

    - name: Lint with flake8
      run: |
        # Stop on syntax errors or undefined names
        flake8 app/scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 app/scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build-kiosk-ui:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      working-directory: app/kiosk-ui
      run: npm install

    - name: Build React app
      working-directory: app/kiosk-ui
      run: npm run build

    - name: Check build output
      run: |
        if [ ! -d "app/kiosk-ui/build" ]; then
          echo "Build directory not found!"
          exit 1
        fi
        echo "Build successful!"
